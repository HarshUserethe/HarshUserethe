<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
  viewBox="0 0 900 280" width="900" height="280" role="img"
  aria-label="Harsh Userethe — Full-Stack Developer and Performance Engineer">

  <title>Harsh Userethe — Full-Stack Developer &amp; Performance Engineer</title>

  <defs>
    <!-- Burgundy palette gradients -->
    <linearGradient id="hu-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10070C"/>
      <stop offset="45%" stop-color="#190B12"/>
      <stop offset="100%" stop-color="#2A0E1C"/>
    </linearGradient>

    <linearGradient id="hu-name-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E5B5C7"/>
      <stop offset="50%" stop-color="#F8F0F3"/>
      <stop offset="100%" stop-color="#C77B9B"/>
    </linearGradient>

    <linearGradient id="hu-accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#701A3D"/>
      <stop offset="100%" stop-color="#451126"/>
    </linearGradient>

    <linearGradient id="hu-glow-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C77B9B" stop-opacity="0"/>
      <stop offset="30%" stop-color="#E5B5C7" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#C77B9B" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#701A3D" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="hu-orb2-grad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C77B9B" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#190B12" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="hu-radial-glow" cx="50%" cy="55%" r="50%">
      <stop offset="0%" stop-color="#701A3D" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#10070C" stop-opacity="0"/>
    </radialGradient>

    <!-- Grain / noise filter for cinematic texture -->
    <filter id="hu-grain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="grayNoise"/>
      <feBlend in="SourceGraphic" in2="grayNoise" mode="overlay" result="blend"/>
      <feComposite in="blend" in2="SourceGraphic" operator="in"/>
    </filter>

    <!-- Blur for soft glow -->
    <filter id="hu-blur-soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
    </filter>

    <filter id="hu-blur-xs" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
    </filter>

    <filter id="hu-glow-text" x="-5%" y="-20%" width="110%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Clip path for the whole SVG canvas -->
    <clipPath id="hu-canvas-clip">
      <rect width="900" height="280" rx="16"/>
    </clipPath>

    <!-- Moving gradient mask for shimmer on name -->
    <linearGradient id="hu-shimmer-grad" x1="-100%" y1="0%" x2="0%" y2="0%" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F8F0F3" stop-opacity="0"/>
      <stop offset="40%" stop-color="#F8F0F3" stop-opacity="1"/>
      <stop offset="100%" stop-color="#F8F0F3" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate"
        values="0,0; 1800,0; 0,0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>

    <mask id="hu-shimmer-mask">
      <rect width="900" height="280" fill="url(#hu-shimmer-grad)"/>
    </mask>
  </defs>

  <!-- Background -->
  <g clip-path="url(#hu-canvas-clip)">
    <rect width="900" height="280" fill="url(#hu-bg-grad)"/>
    <ellipse cx="450" cy="200" rx="520" ry="180" fill="url(#hu-radial-glow)" filter="url(#hu-blur-soft)"/>

    <!-- Technical grid -->
    <g opacity="0.055" stroke="#C77B9B" stroke-width="0.5">
      <line x1="0" y1="0" x2="0" y2="280"/>
      <line x1="60" y1="0" x2="60" y2="280"/>
      <line x1="120" y1="0" x2="120" y2="280"/>
      <line x1="180" y1="0" x2="180" y2="280"/>
      <line x1="240" y1="0" x2="240" y2="280"/>
      <line x1="300" y1="0" x2="300" y2="280"/>
      <line x1="360" y1="0" x2="360" y2="280"/>
      <line x1="420" y1="0" x2="420" y2="280"/>
      <line x1="480" y1="0" x2="480" y2="280"/>
      <line x1="540" y1="0" x2="540" y2="280"/>
      <line x1="600" y1="0" x2="600" y2="280"/>
      <line x1="660" y1="0" x2="660" y2="280"/>
      <line x1="720" y1="0" x2="720" y2="280"/>
      <line x1="780" y1="0" x2="780" y2="280"/>
      <line x1="840" y1="0" x2="840" y2="280"/>
      <line x1="900" y1="0" x2="900" y2="280"/>
      <line x1="0" y1="0" x2="900" y2="0"/>
      <line x1="0" y1="40" x2="900" y2="40"/>
      <line x1="0" y1="80" x2="900" y2="80"/>
      <line x1="0" y1="120" x2="900" y2="120"/>
      <line x1="0" y1="160" x2="900" y2="160"/>
      <line x1="0" y1="200" x2="900" y2="200"/>
      <line x1="0" y1="240" x2="900" y2="240"/>
      <line x1="0" y1="280" x2="900" y2="280"/>
    </g>

    <!-- Orbital geometry -->
    <g opacity="0.12">
      <circle cx="820" cy="50" r="160" fill="none" stroke="#701A3D" stroke-width="1">
        <animateTransform attributeName="transform" type="rotate"
          from="0 820 50" to="360 820 50" dur="40s" repeatCount="indefinite"/>
      </circle>
      <circle cx="820" cy="50" r="110" fill="none" stroke="#C77B9B" stroke-width="0.8"
        stroke-dasharray="4 10">
        <animateTransform attributeName="transform" type="rotate"
          from="360 820 50" to="0 820 50" dur="28s" repeatCount="indefinite"/>
      </circle>
      <circle r="3" fill="#E5B5C7" opacity="0.7">
        <animateMotion dur="28s" repeatCount="indefinite" path="M 820,50 m -110,0 a 110,110 0 1,1 0.001,0 Z"/>
      </circle>
    </g>

    <!-- Secondary floating orb -->
    <ellipse cx="80" cy="230" rx="140" ry="90" fill="url(#hu-orb2-grad)" filter="url(#hu-blur-soft)">
      <animate attributeName="rx" values="140;160;140" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="ry" values="90;110;90" dur="8s" repeatCount="indefinite"/>
    </ellipse>

    <!-- Animated wave path -->
    <path
      d="M -20,195 C 80,175 160,215 280,190 S 460,155 580,185 S 740,215 900,185 L 900,280 L -20,280 Z"
      fill="#451126" opacity="0.18">
      <animate attributeName="d"
        values="M -20,195 C 80,175 160,215 280,190 S 460,155 580,185 S 740,215 900,185 L 900,280 L -20,280 Z;M -20,205 C 80,185 160,205 280,200 S 460,175 580,195 S 740,205 900,195 L 900,280 L -20,280 Z;M -20,195 C 80,175 160,215 280,190 S 460,155 580,185 S 740,215 900,185 L 900,280 L -20,280 Z"
        dur="9s" repeatCount="indefinite"/>
    </path>

    <!-- Accent scanner line -->
    <line x1="60" y1="66" x2="240" y2="66" stroke="#451126" stroke-width="1" opacity="0.7"/>
    <line x1="60" y1="66" x2="75" y2="66" stroke="#C77B9B" stroke-width="2" opacity="0.9">
      <animate attributeName="x2" values="75;240;75" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0.3;0.9" dur="3.5s" repeatCount="indefinite"/>
    </line>

    <!-- Corner brackets -->
    <g stroke="#701A3D" stroke-width="1.5" fill="none" opacity="0.6">
      <path d="M 16,16 L 16,32 M 16,16 L 32,16"/>
      <path d="M 884,16 L 868,16 M 884,16 L 884,32"/>
      <path d="M 16,264 L 16,248 M 16,264 L 32,264"/>
      <path d="M 884,264 L 868,264 M 884,264 L 884,248"/>
    </g>

    <!-- Top label -->
    <text x="60" y="60" font-family="'Courier New', monospace" font-size="10"
      fill="#701A3D" opacity="0.8" letter-spacing="3">PORTFOLIO · 2026</text>

    <!-- Name -->
    <text x="60" y="128"
      font-family="'Georgia', 'Times New Roman', serif"
      font-size="56" font-weight="700" letter-spacing="-1"
      fill="url(#hu-name-grad)" filter="url(#hu-glow-text)">Harsh Userethe</text>

    <!-- Shimmer on name -->
    <text x="60" y="128"
      font-family="'Georgia', 'Times New Roman', serif"
      font-size="56" font-weight="700" letter-spacing="-1"
      fill="#F8F0F3" opacity="0.15" mask="url(#hu-shimmer-mask)">Harsh Userethe</text>

    <!-- Role line -->
    <text x="62" y="160"
      font-family="'Courier New', monospace"
      font-size="15" letter-spacing="4"
      fill="#C77B9B" opacity="0.95">FULL-STACK DEVELOPER  ·  PERFORMANCE ENGINEER</text>

    <!-- Glowing underline -->
    <rect x="60" y="170" width="0" height="2" rx="1" fill="url(#hu-glow-grad)">
      <animate attributeName="width" values="0;520" dur="1.8s" fill="freeze"/>
      <animate attributeName="opacity" values="1;0.6;1" dur="4s" begin="1.8s" repeatCount="indefinite"/>
    </rect>
    <rect x="60" y="170" width="0" height="2" rx="1" fill="url(#hu-glow-grad)"
      filter="url(#hu-blur-xs)" opacity="0.6">
      <animate attributeName="width" values="0;520" dur="1.8s" fill="freeze"/>
    </rect>

    <!-- Tagline -->
    <text x="60" y="202"
      font-family="'Georgia', serif"
      font-size="13" font-style="italic"
      fill="#E5B5C7" opacity="0.6">Code. Build. Optimize. Repeat.</text>

    <!-- Floating particles -->
    <circle cx="820" cy="180" r="1.5" fill="#C77B9B" opacity="0">
      <animate attributeName="cy" values="180;160;180" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.5;0" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="790" cy="210" r="1" fill="#E5B5C7" opacity="0">
      <animate attributeName="cy" values="210;190;210" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.4;0" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="850" cy="150" r="1" fill="#C77B9B" opacity="0">
      <animate attributeName="cy" values="150;135;150" dur="6s" begin="1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.35;0" dur="6s" begin="1s" repeatCount="indefinite"/>
    </circle>

    <!-- Bottom accent bar -->
    <rect x="0" y="272" width="900" height="8" fill="url(#hu-accent-grad)" opacity="0.6"/>

    <!-- Grain texture -->
    <rect width="900" height="280" fill="transparent" filter="url(#hu-grain)" opacity="0.04"/>
  </g>
</svg>
