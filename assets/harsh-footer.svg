<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 60" width="900" height="60"
  role="img" aria-label="Footer decoration">

  <defs>
    <linearGradient id="huf-bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10070C"/>
      <stop offset="50%" stop-color="#190B12"/>
      <stop offset="100%" stop-color="#10070C"/>
    </linearGradient>
    <linearGradient id="huf-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#451126" stop-opacity="0"/>
      <stop offset="25%" stop-color="#C77B9B" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#E5B5C7" stop-opacity="1"/>
      <stop offset="75%" stop-color="#C77B9B" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#451126" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="huf-pulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C77B9B" stop-opacity="0"/>
      <stop offset="50%" stop-color="#F8F0F3" stop-opacity="1"/>
      <stop offset="100%" stop-color="#C77B9B" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate"
        values="-900,0; 900,0; -900,0" dur="3s" repeatCount="indefinite"/>
    </linearGradient>
    <clipPath id="huf-clip">
      <rect width="900" height="60" rx="8"/>
    </clipPath>
  </defs>

  <g clip-path="url(#huf-clip)">
    <rect width="900" height="60" fill="url(#huf-bg)"/>

    <!-- Horizontal rule -->
    <rect x="0" y="1" width="900" height="1" fill="url(#huf-line)"/>

    <!-- Pulse shimmer on rule -->
    <rect x="0" y="1" width="900" height="1" fill="url(#huf-pulse)" opacity="0.6"/>

    <!-- Center text -->
    <text x="450" y="34" text-anchor="middle"
      font-family="'Courier New', monospace" font-size="10"
      fill="#701A3D" letter-spacing="4" opacity="0.8">HARSH USERETHE · FULL-STACK DEVELOPER</text>

    <!-- Decorative dots flanking text -->
    <circle cx="140" cy="33" r="1.5" fill="#C77B9B" opacity="0.5"/>
    <circle cx="760" cy="33" r="1.5" fill="#C77B9B" opacity="0.5"/>

    <!-- Small animated diamonds -->
    <polygon points="108,33 112,29 116,33 112,37" fill="#451126" opacity="0.6">
      <animate attributeName="opacity" values="0.6;0.2;0.6" dur="2.5s" repeatCount="indefinite"/>
    </polygon>
    <polygon points="784,33 788,29 792,33 788,37" fill="#451126" opacity="0.6">
      <animate attributeName="opacity" values="0.2;0.6;0.2" dur="2.5s" repeatCount="indefinite"/>
    </polygon>

    <!-- Bottom gradient bar -->
    <rect x="0" y="58" width="900" height="2" fill="url(#huf-line)" opacity="0.4"/>
  </g>
</svg>
